<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media & Minds — Verification</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
}

.card {
    width: 360px;
    max-width: 85%;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    text-align: center;
}

.club {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.badge {
    display: inline-block;
    margin-top: 25px;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.verified {
    background: #e7f7ed;
    color: #177245;
}

.invalid {
    background: #fde8e8;
    color: #b42318;
}

h1 {
    margin: 12px 0 5px;
    font-size: 27px;
}

.description {
    color: #777;
    margin-bottom: 25px;
}

.info {
    text-align: left;
    border-top: 1px solid #eee;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.label {
    color: #777;
}

.value {
    font-weight: bold;
    text-align: right;
    max-width: 60%;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #999;
}
</style>
</head>

<body>

<div class="card">

    <div class="club">MEDIA & MINDS</div>

    <div id="badge" class="badge">
        VERIFYING...
    </div>

    <h1 id="title">Checking membership</h1>

    <div id="description" class="description">
        Please wait...
    </div>

    <div id="info" class="info"></div>

    <div class="footer">
        Where creativity meets analysis.
    </div>

</div>

<script>

const API_URL = "https://mm-verfication.harmounihamza77.workers.dev";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const badge = document.getElementById("badge");
const title = document.getElementById("title");
const description = document.getElementById("description");
const info = document.getElementById("info");

function showInvalid(message) {

    badge.textContent = "✕ NOT VERIFIED";
    badge.className = "badge invalid";

    title.textContent = "Verification Failed";

    description.textContent = message;

    info.innerHTML = "";
}

function showMember(member) {

    badge.textContent = "✓ VERIFIED MEMBER";
    badge.className = "badge verified";

    title.textContent = member.status;

    description.textContent =
        "This membership has been verified.";

    info.innerHTML = `
        <div class="row">
            <span class="label">Public ID</span>
            <span class="value">${member.public_id}</span>
        </div>

        <div class="row">
            <span class="label">Name</span>
            <span class="value">${member.name}</span>
        </div>

        <div class="row">
            <span class="label">Branch</span>
            <span class="value">${member.branch}</span>
        </div>

        <div class="row">
            <span class="label">Status</span>
            <span class="value">${member.status}</span>
        </div>
    `;
}

async function verifyMember() {

    if (!token) {
        showInvalid("No verification token was provided.");
        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/verify?token=${encodeURIComponent(token)}`
        );

        const data = await response.json();

        if (data.verified) {
            showMember(data.member);
        } else {
            showInvalid(data.message || "Member not found.");
        }

    } catch (error) {

        showInvalid(
            "Verification service is temporarily unavailable."
        );
    }
}

verifyMember();

</script>

</body>
</html>
