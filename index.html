<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media & Minds — Verification</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
}

.card {
    width: 360px;
    max-width: 85%;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    text-align: center;
}

.club {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.verified {
    display: inline-block;
    margin-top: 25px;
    padding: 8px 15px;
    border-radius: 20px;
    background: #e7f7ed;
    color: #177245;
    font-size: 13px;
    font-weight: bold;
}

h1 {
    margin: 12px 0 5px;
    font-size: 27px;
}

.description {
    color: #777;
    margin-bottom: 25px;
}

.info {
    text-align: left;
    border-top: 1px solid #eee;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.label {
    color: #777;
}

.value {
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #999;
}
</style>
</head>

<body>

<div class="card">

    <div class="club">
        MEDIA & MINDS
    </div>

    <div class="verified">
        ✓ VERIFIED MEMBER
    </div>

    <h1>Active Member</h1>

    <div class="description">
        This membership has been verified.
    </div>

    <div class="info">

        <div class="row">
            <span class="label">Public ID</span>
            <span class="value">MM/26/001</span>
        </div>

        <div class="row">
            <span class="label">Name</span>
            <span class="value">Test Member</span>
        </div>

        <div class="row">
            <span class="label">Branch</span>
            <span class="value">English Studies</span>
        </div>

        <div class="row">
            <span class="label">Status</span>
            <span class="value">ACTIVE</span>
        </div>

    </div>

    <div class="footer">
        Where creativity meets analysis.
    </div>

</div>

</body>
</html>
